features:
  core:
    pacman:
      - acpi
      - age
      - base-devel
      - bash-completion
      - ca-certificates
      - curl
      - fakeroot
      - git
      - gnupg
      - go-yq
      - greetd
      - greetd-tuigreet
      - keyd
      - libgcrypt
      - lm_sensors
      - lsof
      - man-db
      - openssh
      - pinentry
      - reflector
      - rsync
      - screen
      - sudo
      - tk
      - usbutils
    aur:
      - git-remote-gcrypt
    services:
      - reflector.timer
      - systemd-resolved.service
      - systemd-timesyncd.service
      - keyd.service
  gui:
    pacman:
      - firefox
      - flameshot
      - gnome-keyring
      - mesa
      - pipewire-jack
      - pipewire-pulse
      - polkit-gnome
      - warp-terminal
      - wireplumber
    aur:
      - visual-studio-code-bin
  xorg:
    pacman:
      - dmenu
      - dunst
      - lxappearance
      - picom
      - wmctrl
      - xdg-utils
      - xorg-apps
      - xorg-server
      - xorg-xeyes
      - xorg-xinit
      - xorg-xmessage
      - xsel
      - xterm
  xmonad:
    pacman:
      - adwaita-fonts
      - noto-fonts-emoji
      - ttf-croscore
      - xmonad
      - xmonad-contrib
    aur:
      - xsct
  laptop:
    pacman:
      - acpilight
      - powertop
      - tlp
      - x86_energy_perf_policy
  wifi:
    pacman:
      - iwd
    services:
      - iwd.service
  lang:
    pacman:
      - go
      - nodejs
      - fnm
      - python
      - rustup
  util:
    pacman:
      - atuin
      - ddcutil
      - eza
      - github-cli
      - inetutils
      - jq
      - ms-edit
      - openbsd-netcat
      - python-black
      - smartmontools
      - the_silver_searcher
      - vim
      - which
      - whois
    aur:
      - flyctl
  virt:
    pacman:
      - dnsmasq
      - docker
      - docker-buildx
      - docker-compose
      - libvirt
  steam:
    pacman:
      - lib32-mesa
      - lib32-systemd
      - steam
    multilib: true
  printing:
    pacman:
      - cups
    services:
      - cups.service
